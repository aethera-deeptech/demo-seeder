# Runs the seeder next to the API or anywhere that can reach it. Copy .env.example to .env and config/demo.example.toml to config/demo.toml.
services:
  seeder:
    build: .
    image: aethera-demo-seeder:local
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config/demo.toml:/config/demo.toml:ro
      - ./plugins:/app/plugins:ro
      - seeder-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  seeder-data:
