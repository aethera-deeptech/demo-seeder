name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # coverage is the one tool that is not in the standard library, so it goes into a throwaway virtual environment
      - name: Install coverage
        env:
          # renovate: datasource=pypi depName=coverage
          version: 7.6.10
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "coverage==${version}"

      - name: Test with coverage
        run: |
          "$RUNNER_TEMP/venv/bin/coverage" run --source=seeder --branch -m unittest discover -s . -t . -v
          "$RUNNER_TEMP/venv/bin/coverage" xml -o coverage.xml
          "$RUNNER_TEMP/venv/bin/coverage" report --skip-empty

      - name: Check the example configuration
        env:
          DEMO_PASSWORD: example-password
        run: python3 -m seeder check -c config/demo.example.toml

      # A failed upload only fails the build on the main branch, because a Codecov outage must not block a pull request. A pull request
      # from a fork has no token, and its upload fails without failing the build.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: ${{ github.ref == 'refs/heads/main' }}
